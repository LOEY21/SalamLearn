<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Mascot Tutorial — Motion Preview</title>
<style>
  :root{
    --teal:#2FAE9E; --gold:#E8A93B; --coral:#F0765C; --cream:#FAF6EC;
    --ink:#2D2D2D; --mint:#DCEFE9;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;background:#111;font-family:'Segoe UI',system-ui,sans-serif;}
  #stage{
    position:relative;
    width:390px;height:844px;
    margin:24px auto;
    border-radius:36px;
    overflow:hidden;
    box-shadow:0 30px 80px rgba(0,0,0,.6);
    background:linear-gradient(180deg,#BFE3D8 0%,#8FCDBE 40%,#5CA98F 100%);
  }
  /* ---- fake map content ---- */
  #mapBg{position:absolute;inset:0;background:
      radial-gradient(circle at 30% 20%, rgba(255,255,255,.25), transparent 40%),
      radial-gradient(circle at 70% 60%, rgba(255,255,255,.15), transparent 35%),
      linear-gradient(180deg,#BFE3D8 0%,#8FCDBE 45%,#4E9781 100%);
  }
  #topbar{
    position:absolute;top:0;left:0;right:0;
    padding:14px 12px 10px;
    display:flex;justify-content:space-evenly;gap:8px;z-index:5;
  }
  .pill{
    background:rgba(255,255,255,.92);
    border-radius:99px;padding:6px 14px;
    display:flex;align-items:center;gap:5px;
    font-weight:800;font-size:13px;color:var(--ink);
    box-shadow:0 3px 10px rgba(0,0,0,.12);
    position:relative;z-index:6;
  }
  #node{
    position:absolute; top:46%; left:38%;
    width:74px;height:74px;border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #fff, var(--gold));
    box-shadow:0 8px 20px rgba(232,169,59,.5), 0 0 0 5px rgba(255,255,255,.6);
    display:flex;align-items:center;justify-content:center;
    font-size:28px; cursor:pointer; z-index:6;
    animation:nodePulse 2.2s ease-in-out infinite;
  }
  @keyframes nodePulse{
    0%,100%{transform:scale(1);}
    50%{transform:scale(1.06);}
  }
  #mapAvatar{
    position:absolute; top:44%; left:52%;
    width:46px;height:46px;z-index:6;
    filter:drop-shadow(0 4px 8px rgba(0,0,0,.25));
  }
  #mapAvatar img{width:100%;display:block;}
  #bottomnav{
    position:absolute;bottom:14px;left:16px;right:16px;
    height:64px;border-radius:24px;
    background:rgba(255,255,255,.95);
    box-shadow:0 10px 30px rgba(0,0,0,.2);
    display:flex;align-items:center;justify-content:space-around;
    z-index:5;
  }
  .navtab{display:flex;flex-direction:column;align-items:center;gap:2px;
    font-size:10px;font-weight:700;color:#9a9488; position:relative; z-index:6;}
  .navtab .ic{font-size:20px;}
  .navtab.active{color:var(--teal);}

  /* ---- tutorial overlay ---- */
  #tut{position:absolute;inset:0;z-index:50;opacity:0;pointer-events:none;
    transition:opacity .4s ease-out;}
  #tut.on{opacity:1;pointer-events:auto;}

  #dim{position:absolute;inset:0;background:rgba(0,0,0,.7);
    transition:background .42s cubic-bezier(0.34,1.56,0.64,1);}

  #spot{position:absolute;border-radius:20px;
    box-shadow:0 0 0 4000px rgba(0,0,0,.62);
    border:2px solid rgba(255,255,255,.85);
    transition:top .42s cubic-bezier(0.4,0,0.2,1), left .42s cubic-bezier(0.4,0,0.2,1),
               width .42s cubic-bezier(0.4,0,0.2,1), height .42s cubic-bezier(0.4,0,0.2,1),
               border-radius .3s ease, opacity .25s ease;
    opacity:0;
    animation:ringPulse 1.2s ease-in-out infinite;
  }
  #spot.show{opacity:1;}
  @keyframes ringPulse{
    0%,100%{ box-shadow:0 0 0 4000px rgba(0,0,0,.62), 0 0 0 2px rgba(255,255,255,.5) inset; }
    50%{ box-shadow:0 0 0 4000px rgba(0,0,0,.62), 0 0 0 6px rgba(255,255,255,.95) inset; }
  }
  #dim.full{background:rgba(0,0,0,.35);}

  /* mascot */
  #mascotWrap{position:absolute;bottom:60px;width:270px;height:330px;z-index:52;
    /* Side (left/right/center) is set instantly, no position transition —
       flipping "left" transitions across the whole screen width reads as a
       fast horizontal pan and is the nauseating motion. The pop-in below is
       the only entrance cue, and it's vertical, not lateral. */
  }
  #mascotWrap img{width:100%;display:block;
    filter:drop-shadow(0 10px 18px rgba(0,0,0,.35));
    animation:idleTilt 3.4s ease-in-out infinite;
    transform-origin:bottom center;
  }
  @keyframes idleTilt{
    0%,100%{transform:rotate(-3deg);}
    50%{transform:rotate(3deg);}
  }
  .mascot-enter img{ animation:popIn .5s cubic-bezier(0.34,1.56,0.64,1) both, idleTilt 3.4s ease-in-out infinite .5s; }
  @keyframes popIn{
    0%{ transform:translateY(40px) scale(.85); opacity:0; }
    100%{ transform:translateY(0) scale(1); opacity:1; }
  }
  /* Exit gets its own accelerate curve, no spring/overshoot — entrances
     invite the eye in with a bounce, exits should just leave, calmly and
     a touch quicker (30-50% shorter), per the motion rules' enter>exit rule. */
  .mascot-exit img{ animation:popOut .32s cubic-bezier(0.4,0,1,1) forwards; }
  @keyframes popOut{
    0%{ transform:translateY(0) scale(1); opacity:1; }
    100%{ transform:translateY(26px) scale(.82); opacity:0; }
  }

  /* speech bubble */
  #bubble{
    position:absolute; z-index:53;
    max-width:220px;
    background:#fff;border:2.5px solid var(--gold);
    border-radius:20px 20px 20px 6px;
    padding:14px 16px 12px;
    box-shadow:0 10px 24px rgba(0,0,0,.2), 0 0 24px rgba(232,169,59,.15);
    opacity:0; transform:scale(.7);
    transition:opacity .35s cubic-bezier(0.34,1.56,0.64,1), transform .35s cubic-bezier(0.34,1.56,0.64,1),
               left .5s cubic-bezier(0.4,0,0.2,1), right .5s cubic-bezier(0.4,0,0.2,1), top .5s cubic-bezier(0.4,0,0.2,1);
  }
  #bubble.show{opacity:1;transform:scale(1);}
  /* Same accelerate-exit reasoning as the mascot's popOut — the bubble
     leaves on its own faster curve instead of reversing through the
     springy entrance transition, so mascot + bubble read as one calm exit. */
  #bubble.bubble-exit{
    transition:opacity .28s cubic-bezier(0.4,0,1,1), transform .28s cubic-bezier(0.4,0,1,1);
    opacity:0; transform:scale(.85) translateY(10px);
  }
  #bubble.bubble-left{ border-radius:20px 20px 6px 20px; }
  .badge{display:inline-block;background:var(--teal);color:#fff;font-size:11px;font-weight:800;
    padding:3px 10px;border-radius:10px;letter-spacing:.4px;margin-bottom:8px;}
  #line{font-size:14.5px;font-weight:600;color:var(--ink);line-height:1.4;min-height:56px;
    transition:opacity .25s ease, transform .25s ease;}
  #line.fade{opacity:0;transform:translateY(6px);}
  .tapRow{display:flex;justify-content:flex-end;align-items:center;gap:4px;margin-top:8px;
    font-size:11px;font-weight:700;color:#9a9488;}
  .tapRow.hot{color:var(--teal);}
  .tapRow .p{animation:pulseOpacity 1.2s ease-in-out infinite;}
  @keyframes pulseOpacity{0%,100%{opacity:.5;}50%{opacity:1;}}
  #dots{display:flex;justify-content:center;gap:5px;margin-top:10px;}
  .dot{height:6px;border-radius:3px;background:rgba(255,255,255,.35);width:6px;transition:width .2s,background .2s;}
  .dot.active{width:18px;background:#fff;}

  /* skip chip */
  #skip{position:absolute; bottom:96px; right:16px; z-index:54;
    background:rgba(255,255,255,.9); border-radius:99px; padding:6px 14px;
    font-size:12px;font-weight:800;color:#6b6558; opacity:0; transition:opacity .3s ease;
    pointer-events:none; cursor:pointer;
  }
  #skip.show{opacity:1;pointer-events:auto;}

  /* cheer confetti (ambient) */
  .spark{position:absolute; font-size:20px; opacity:0; pointer-events:none; z-index:55;}
  .spark.go{animation:sparkFly 1.1s ease-out forwards;}
  @keyframes sparkFly{
    0%{opacity:0; transform:translate(0,0) scale(.4) rotate(0deg);}
    15%{opacity:1;}
    100%{opacity:0; transform:var(--fly) scale(1.1) rotate(200deg);}
  }

  #hint{position:fixed;bottom:10px;left:0;right:0;text-align:center;color:#999;font-size:12px;font-family:monospace;}
  #panel{position:fixed;top:20px;right:24px;width:280px;background:#1c1c1c;color:#ddd;
    border-radius:12px;padding:14px 16px;font-size:12.5px;line-height:1.5;font-family:monospace;}
  #panel b{color:#fff;}
  #restartBtn{position:fixed;top:20px;left:24px;background:#2FAE9E;color:#fff;border:none;
    padding:10px 16px;border-radius:10px;font-weight:700;cursor:pointer;font-family:inherit;}
</style>
</head>
<body>

<button id="restartBtn" onclick="restart()">↺ Restart tutorial</button>
<div id="panel">
  <b>Beat <span id="beatNum">1</span> / 8</b><br>
  Target: <span id="beatTarget">none (full dim)</span><br>
  Pose: <span id="beatPose">wave</span><br><br>
  Click anywhere on the phone to advance (steps 1–6).<br>
  Step 7 requires tapping the glowing gold node.
</div>

<div id="stage">
  <div id="mapBg"></div>

  <div id="topbar">
    <div class="pill" id="pillStreak">🔥 5</div>
    <div class="pill" id="pillXp">⭐ 800</div>
    <div class="pill" id="pillEnergy">🏮🏮🏮</div>
  </div>

  <div id="node">🕌</div>
  <div id="mapAvatar"><img src="../prjct/assets/images/mascot/boy/wave.png" alt=""></div>

  <div id="bottomnav">
    <div class="navtab active"><div class="ic">🗺️</div>Map</div>
    <div class="navtab" id="navBackpack"><div class="ic">🎒</div>Backpack</div>
    <div class="navtab"><div class="ic">🙂</div>Me</div>
  </div>

  <!-- Tutorial overlay -->
  <div id="tut">
    <div id="dim"></div>
    <div id="spot"></div>

    <div id="mascotWrap" class="mascot-enter">
      <img id="mascotImg" src="../prjct/assets/images/mascot/boy/wave.png" alt="Amir">
    </div>

    <div id="bubble">
      <span class="badge">Amir</span>
      <div id="line"></div>
      <div class="tapRow" id="tapRow"><span id="tapText">Tap to continue</span><span class="p">👉</span></div>
      <div id="dots"></div>
    </div>

    <div id="skip" onclick="finish()">Skip ▸</div>
  </div>
</div>

<div id="hint">dumps/mascot_tutorial_preview_mock.html — approve motion, then Dart port begins</div>

<script>
const steps = [
  { target:null, pose:'wave', side:'left', name:'Amir',
    lines:["Assalamu'alaikum, Zayd! 🌟","I'm Amir, and I'll be your friend on this whole adventure!"],
    dim:'dim' },
  { target:null, pose:'present', side:'left', name:'Amir',
    lines:["This is our Adventure Map. Every place here has something new to learn!"],
    dim:'full' },
  { target:'#pillEnergy', pose:'point_up', side:'left', name:'Amir',
    lines:["These lanterns are your Noor Energy. Each lesson uses one — they refill when you rest!"],
    dim:'spot' },
  { target:'#pillStreak', pose:'point_up', side:'left', name:'Amir',
    lines:["Stars are the points you earn. The flame counts your days in a row!"],
    dim:'spot' },
  { target:'#mapAvatar', pose:'present', side:'right', name:'Amir',
    lines:["See that? That's YOU, standing on the map. You move forward with every lesson you finish!"],
    dim:'spot' },
  { target:'#navBackpack', pose:'point_down', side:'right', name:'Amir',
    lines:["Your Backpack keeps every badge you win. Check it any time!"],
    dim:'spot' },
  { target:'#node', pose:'point_down', side:'right', name:'Amir',
    lines:["Now — tap the glowing place to start your very first lesson. Bismillah!"],
    dim:'spot', requireNodeTap:true },
  { target:null, pose:'cheer', side:'center', name:'Amir',
    lines:["Masha'Allah! You did it! I'll be right here whenever you need me. 🎉"],
    dim:'full', final:true },
];

let stepIdx = 0, lineIdx = 0, awaitingNodeTap = false;

const tut = document.getElementById('tut');
const dim = document.getElementById('dim');
const spot = document.getElementById('spot');
const mascotWrap = document.getElementById('mascotWrap');
const mascotImg = document.getElementById('mascotImg');
const bubble = document.getElementById('bubble');
const lineEl = document.getElementById('line');
const dotsEl = document.getElementById('dots');
const tapRow = document.getElementById('tapRow');
const tapText = document.getElementById('tapText');
const skipChip = document.getElementById('skip');
const node = document.getElementById('node');
const stage = document.getElementById('stage');

function poseSrc(p){ return '../prjct/assets/images/mascot/boy/' + p + '.png'; }

function positionSpot(sel){
  if(!sel){ spot.classList.remove('show'); return; }
  const t = document.querySelector(sel);
  const stageRect = stage.getBoundingClientRect();
  const r = t.getBoundingClientRect();
  const pad = 10;
  spot.style.top = (r.top - stageRect.top - pad) + 'px';
  spot.style.left = (r.left - stageRect.left - pad) + 'px';
  spot.style.width = (r.width + pad*2) + 'px';
  spot.style.height = (r.height + pad*2) + 'px';
  spot.classList.add('show');
}

function renderMascotSide(side){
  mascotWrap.style.right = '';
  mascotWrap.style.left = '';
  bubble.classList.remove('bubble-left');
  if(side === 'left'){
    mascotWrap.style.left = '-30px';
    bubble.style.left = '210px';
    bubble.style.right = '16px';
    bubble.style.top = '90px';
  } else if(side === 'right'){
    mascotWrap.style.right = '-30px';
    bubble.classList.add('bubble-left');
    bubble.style.right = '210px';
    bubble.style.left = '16px';
    bubble.style.top = '90px';
  } else {
    mascotWrap.style.left = '60px';
    bubble.style.left = '55px';
    bubble.style.right = '55px';
    bubble.style.top = '340px';
  }
}

function renderDots(total, active){
  dotsEl.innerHTML = '';
  for(let i=0;i<total;i++){
    const d = document.createElement('div');
    d.className = 'dot' + (i===active ? ' active' : '');
    dotsEl.appendChild(d);
  }
}

function spawnConfetti(){
  const emojis = ['✨','🎉','⭐','🪙'];
  for(let i=0;i<10;i++){
    const s = document.createElement('div');
    s.className = 'spark';
    s.textContent = emojis[i % emojis.length];
    const x = (Math.random()*260 - 130).toFixed(0);
    const y = (-(160 + Math.random()*160)).toFixed(0);
    s.style.setProperty('--fly', `translate(${x}px, ${y}px)`);
    s.style.left = '195px'; s.style.top = '300px';
    stage.appendChild(s);
    requestAnimationFrame(()=> s.classList.add('go'));
    setTimeout(()=> s.remove(), 1200);
  }
}

function loadStep(i, isFirst){
  const st = steps[i];
  document.getElementById('beatNum').textContent = i+1;
  document.getElementById('beatTarget').textContent = st.target || 'none';
  document.getElementById('beatPose').textContent = st.pose;

  // dim mode
  dim.classList.toggle('full', st.dim === 'full' && !st.target);
  if(st.dim === 'spot' && st.target){
    dim.classList.remove('full');
    positionSpot(st.target);
  } else {
    spot.classList.remove('show');
  }

  renderMascotSide(st.side);
  mascotImg.src = poseSrc(st.pose);

  if(!isFirst){
    mascotWrap.classList.remove('mascot-enter');
    void mascotWrap.offsetWidth;
    mascotWrap.classList.add('mascot-enter');
  }

  bubble.classList.remove('show');
  setTimeout(()=> bubble.classList.add('show'), isFirst ? 380 : 120);

  lineIdx = 0;
  showLine();
  renderDots(steps.length, i);

  skipChip.classList.toggle('show', i >= 1 && !st.final);

  awaitingNodeTap = !!st.requireNodeTap;
  node.style.pointerEvents = awaitingNodeTap ? 'auto' : 'none';
  node.style.cursor = awaitingNodeTap ? 'pointer' : 'default';

  if(st.final){
    tapRow.style.visibility = 'hidden';
    spawnConfetti();
    setTimeout(finish, 2200);
  } else {
    tapRow.style.visibility = 'visible';
    tapRow.classList.toggle('hot', awaitingNodeTap);
    tapText.textContent = awaitingNodeTap ? 'Tap the glowing spot ↑'
      : (isLastLineOfStep() ? (i === steps.length-2 ? 'Tap to continue' : 'Tap to continue') : 'Tap to continue');
  }
}

function isLastLineOfStep(){
  return lineIdx >= steps[stepIdx].lines.length - 1;
}

function showLine(){
  const st = steps[stepIdx];
  lineEl.classList.add('fade');
  setTimeout(()=>{
    lineEl.textContent = st.lines[lineIdx];
    lineEl.classList.remove('fade');
  }, 180);
}

function advance(){
  if(awaitingNodeTap) return; // must tap the node itself
  const st = steps[stepIdx];
  if(lineIdx < st.lines.length - 1){
    lineIdx++;
    showLine();
    return;
  }
  if(stepIdx < steps.length - 1){
    stepIdx++;
    loadStep(stepIdx, false);
  }
}

function onNodeTap(e){
  e.stopPropagation();
  if(!awaitingNodeTap) return;
  awaitingNodeTap = false;
  node.style.pointerEvents = 'none';
  stepIdx++;
  loadStep(stepIdx, false);
}

function finish(){
  // Mascot and bubble get their own accelerate exit first — dismissing the
  // whole overlay immediately (the old behaviour) just cut them, it never
  // looked like Amir actually left.
  mascotWrap.classList.remove('mascot-enter');
  void mascotWrap.offsetWidth; // restart animation cleanly if retriggered
  mascotWrap.classList.add('mascot-exit');
  bubble.classList.add('bubble-exit');
  skipChip.classList.remove('show');
  spot.classList.remove('show');

  setTimeout(() => {
    tut.classList.remove('on');
    mascotWrap.classList.remove('mascot-exit');
    bubble.classList.remove('bubble-exit', 'show');
  }, 320);
}

function restart(){
  stepIdx = 0;
  mascotWrap.classList.remove('mascot-exit');
  bubble.classList.remove('bubble-exit');
  tut.classList.add('on');
  loadStep(0, true);
}

tut.addEventListener('click', advance);
node.addEventListener('click', onNodeTap);

restart();
</script>
</body>
</html>
